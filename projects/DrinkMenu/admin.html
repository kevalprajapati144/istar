<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><title>Admin | Drinks Management System</title></head><body>
<nav class="navbar py-3"><div class="container"><a class="brand" href="index.html">Drinks<span>.</span>MS <small class="text-secondary fw-normal fs-6">Admin</small></a><div class="d-flex gap-2"><a class="icon-btn text-decoration-none text-dark" href="index.html">View shop</a><button class="icon-btn d-none" id="logout">Log out</button></div></div></nav>
<main class="container pb-5">
<div id="loginBox" class="mx-auto mt-5" style="max-width:400px"><form class="admin-card p-4 vstack gap-3" id="loginForm"><h1 class="h4 fw-bold mb-0">Admin login</h1><div><label class="form-label" for="pw">Password</label><input id="pw" type="password" class="form-control" required autocomplete="current-password"></div><div id="loginErr" class="text-danger small"></div><button class="btn btn-pink">Log in</button><small class="text-secondary">Demo password: admin123</small></form></div>
<div id="panel" class="d-none"><div class="row g-3 mb-4" id="stats"></div>
<div class="row g-3 mb-4"><div class="col-lg-7"><div class="admin-card p-3 h-100"><h2 class="h6 fw-bold">Best sellers</h2><div id="sellers"></div></div></div><div class="col-lg-5"><div class="admin-card p-3 h-100"><h2 class="h6 fw-bold">Low stock</h2><div id="low"></div></div></div></div>
<ul class="nav nav-tabs mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tDrinks">Drinks</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tOrders">Orders</button></li></ul>
<div class="tab-content"><div class="tab-pane fade show active" id="tDrinks"><div class="d-flex justify-content-between mb-3"><h2 class="h5 fw-bold mb-0">Manage drinks</h2><button class="btn btn-pink btn-sm" id="addBtn">Add drink</button></div>
<div class="table-responsive admin-card"><table class="table align-middle mb-0"><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="drinkRows"></tbody></table></div></div>
<div class="tab-pane fade" id="tOrders"><div class="d-flex justify-content-between mb-3"><h2 class="h5 fw-bold mb-0">Customer orders</h2><button class="btn btn-sm btn-outline-danger rounded-pill" id="resetBtn">Reset demo data</button></div>
<div class="table-responsive admin-card"><table class="table align-middle mb-0"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="orderRows"></tbody></table></div></div></div></div></main>

<div class="modal fade" id="drinkModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="drinkForm"><div class="modal-header"><h5 class="modal-title fw-bold" id="mTitle">Add drink</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body row g-3"><input type="hidden" id="fId">
<div class="col-8"><label class="form-label" for="fName">Name</label><input id="fName" class="form-control" required></div><div class="col-4"><label class="form-label" for="fEmoji">Emoji</label><input id="fEmoji" class="form-control" value="🥤" required></div>
<div class="col-8"><label class="form-label" for="fCat">Category</label><input id="fCat" class="form-control" list="catList" required><datalist id="catList"></datalist></div><div class="col-4"><label class="form-label" for="fColor">Colour</label><input id="fColor" type="color" class="form-control form-control-color w-100" value="#ff3d81"></div>
<div class="col-4"><label class="form-label" for="fPrice">Price (₹)</label><input id="fPrice" type="number" min="1" class="form-control" required></div><div class="col-4"><label class="form-label" for="fOld">Old price</label><input id="fOld" type="number" min="0" class="form-control" value="0"></div><div class="col-4"><label class="form-label" for="fStock">Stock</label><input id="fStock" type="number" min="0" class="form-control" required></div>
<div class="col-12"><label class="form-label" for="fDesc">Description</label><textarea id="fDesc" class="form-control" rows="2"></textarea></div>
<div class="col-6 form-check form-switch ps-5"><input class="form-check-input" type="checkbox" id="fTrend"><label class="form-check-label" for="fTrend">Trending</label></div><div class="col-6 form-check form-switch ps-5"><input class="form-check-input" type="checkbox" id="fAvail" checked><label class="form-check-label" for="fAvail">Available</label></div></div>
<div class="modal-footer"><button class="btn btn-pink">Save drink</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script><script src="js/store.js"></script><script src="js/admin.js"></script></body></html>
